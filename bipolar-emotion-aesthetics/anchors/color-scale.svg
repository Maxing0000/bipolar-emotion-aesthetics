<svg viewBox="0 0 680 170" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>色彩维度 0-10 锚定图卡</title>
  <rect x="0" y="0" width="680" height="170" fill="#FAFAF8"/>
  <text x="20" y="24" font-size="13" font-weight="500" fill="#444441">色彩（饱和·撞色） · 危极强度锚定（左=亲极，右=危极）</text>
  <rect x="30" y="55" width="90" height="64" fill="#E8E2D8"/>
  <text x="75" y="135" text-anchor="middle" font-size="11" fill="#085041">0–1 柔暖低饱和·大地色</text>
  <rect x="140" y="55" width="90" height="64" fill="#D9D2C4"/>
  <text x="185" y="135" text-anchor="middle" font-size="11" fill="#085041">2–3 邻近色·莫兰迪</text>
  <rect x="250" y="55" width="90" height="64" fill="#C9C0A8"/>
  <text x="295" y="135" text-anchor="middle" font-size="11" fill="#444441">4–5 微暖·饱和度中等</text>
  <rect x="360" y="55" width="90" height="64" fill="#D24A28"/>
  <text x="405" y="135" text-anchor="middle" font-size="11" fill="#791F1F">6–7 高饱和原色</text>
  <rect x="470" y="55" width="45" height="64" fill="#1F4FD8"/><rect x="515" y="55" width="45" height="64" fill="#F2B705"/>
  <text x="515" y="135" text-anchor="middle" font-size="11" fill="#791F1F">8–9 互补撞色·极端冷色</text>
  <rect x="580" y="55" width="30" height="64" fill="#CCFF00"/><rect x="610" y="55" width="30" height="64" fill="#FF00E4"/>
  <text x="610" y="135" text-anchor="middle" font-size="11" fill="#501313">10 越阈·荧光刺目</text>
  <text x="20" y="158" font-size="11" fill="#888780">定级方法：与相邻两档比对取更近者；卡在中间取中间值。定义见 theory.md 3.2 色彩色相行</text>
</svg>
