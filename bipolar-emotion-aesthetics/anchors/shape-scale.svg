<svg viewBox="0 0 680 170" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>形状线条维度 0-10 锚定图卡</title>
  <rect x="0" y="0" width="680" height="170" fill="#FAFAF8"/>
  <text x="20" y="24" font-size="13" font-weight="500" fill="#444441">形状线条 · 危极强度锚定（左=亲极，右=危极）</text>
  <rect x="30" y="55" width="64" height="64" rx="26" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="62" y="135" text-anchor="middle" font-size="11" fill="#085041">0–1 饱满大圆角</text>
  <rect x="120" y="55" width="64" height="64" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="152" y="135" text-anchor="middle" font-size="11" fill="#085041">2–3 小圆角·曲线为主</text>
  <path d="M210 55 h44 a12 12 0 0 1 12 12 v40 a12 12 0 0 1 -12 12 h-44 l-14 -32 z" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="234" y="135" text-anchor="middle" font-size="11" fill="#444441">4–5 曲直平衡</text>
  <path d="M300 55 l64 32 -64 32 z" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="332" y="135" text-anchor="middle" font-size="11" fill="#791F1F">6–7 明显锐角·楔形</text>
  <path d="M390 55 l16 12 -12 8 14 10 -12 8 16 12 -6 14 -58 0 0 -64 z" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="422" y="135" text-anchor="middle" font-size="11" fill="#791F1F">8–9 锯齿·尖刺·破碎</text>
  <path d="M480 55 l20 18 -14 9 18 12 -14 9 20 16 -10 0 -18 -12 12 -9 -16 -11 14 -9 -16 -12 8 0 z" fill="#E24B4A" stroke="#501313" stroke-width="1"/>
  <text x="512" y="135" text-anchor="middle" font-size="11" fill="#501313">10 越阈·伤害联想</text>
  <text x="20" y="158" font-size="11" fill="#888780">定级方法：与相邻两档比对取更近者；卡在中间取中间值。定义见 theory.md 3.7</text>
</svg>
