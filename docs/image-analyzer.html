<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEA 图片分析助手 · 双极情绪美学</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --text-primary: #f5e6d3;
            --text-secondary: #a8a29e;
            --text-tertiary: #6b6560;
            --accent-gold: #d4a574;
            --accent-gold-light: #e8c9a0;
            --border-color: rgba(212,165,116,0.15);
            --paradigm-healing: #66bb6a;
            --paradigm-friendly: #42a5f5;
            --paradigm-balanced: #7c8bd6;
            --paradigm-sublime: #ff7043;
            --paradigm-cold: #78909c;
            --paradigm-avant: #ba68c8;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ===== 导航 ===== */
        .header {
            background: rgba(26,26,26,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            flex-shrink: 0;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            overflow: hidden;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-text h1 {
            font-size: 16px;
            font-weight: 700;
            font-family: 'Noto Serif SC', serif;
        }

        .logo-text p {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-gold);
        }

        /* ===== 主内容 ===== */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* ===== 上传区域 ===== */
        .upload-section {
            background: var(--bg-secondary);
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 48px 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 24px;
        }

        .upload-section:hover, .upload-section.dragover {
            border-color: var(--accent-gold);
            background: rgba(212,165,116,0.05);
        }

        .upload-section:active {
            transform: scale(0.99);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .upload-section h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            font-family: 'Noto Serif SC', serif;
        }

        .upload-section p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .upload-formats {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        /* ===== 示例图片 ===== */
        .examples-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 3px;
            height: 16px;
            background: var(--accent-gold);
            border-radius: 2px;
        }

        .examples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .example-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .example-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-gold);
        }

        .example-card:active {
            transform: scale(0.98);
        }

        .example-image {
            width: 100%;
            height: 90px;
            object-fit: cover;
        }

        .example-label {
            padding: 8px 10px;
            font-size: 12px;
            text-align: center;
            color: var(--text-secondary);
        }

        /* ===== 分析结果 ===== */
        .result-section {
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .result-title {
            font-size: 20px;
            font-weight: 700;
            font-family: 'Noto Serif SC', serif;
        }

        .result-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 40px;
        }

        .btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--accent-gold);
            color: #1a1a1a;
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        .btn-primary:hover {
            background: var(--accent-gold-light);
            color: #1a1a1a;
        }

        /* ===== 分析概览 ===== */
        .overview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .image-panel {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .analyzed-image {
            width: 100%;
            display: block;
        }

        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .analysis-point {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: white;
            transform: translate(-50%, -50%);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
        }

        .analysis-point.danger { background: #ef5350; }
        .analysis-point.safe { background: #66bb6a; }

        /* ===== W(T) 展示 ===== */
        .wt-panel {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .wt-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .wt-value {
            font-size: 64px;
            font-weight: 900;
            font-family: 'Noto Serif SC', serif;
            color: var(--accent-gold);
            line-height: 1;
            margin-bottom: 8px;
        }

        .wt-paradigm {
            font-size: 18px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .wt-description {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.7;
        }

        /* ===== 维度分析 ===== */
        .dimensions-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .dimensions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .dimension-card {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 16px;
        }

        .dimension-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .dimension-name {
            font-size: 14px;
            font-weight: 600;
        }

        .dimension-score {
            font-size: 20px;
            font-weight: 700;
            font-family: 'Noto Serif SC', serif;
        }

        .dimension-bar {
            height: 6px;
            background: var(--bg-primary);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .dimension-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .dimension-polarity {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
        }

        .polarity-p { background: rgba(102,187,106,0.2); color: #66bb6a; }
        .polarity-n { background: rgba(120,144,156,0.2); color: #78909c; }
        .polarity-t { background: rgba(239,83,80,0.2); color: #ef5350; }

        .dimension-reason {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 8px;
            line-height: 1.5;
        }

        /* ===== 四维评分 ===== */
        .scores-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .scores-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .score-card {
            text-align: center;
            padding: 16px;
            background: var(--bg-tertiary);
            border-radius: 8px;
        }

        .score-value {
            font-size: 36px;
            font-weight: 900;
            font-family: 'Noto Serif SC', serif;
            margin-bottom: 4px;
        }

        .score-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .score-total {
            background: linear-gradient(135deg, rgba(212,165,116,0.2), rgba(212,165,116,0.05));
            border: 1px solid var(--accent-gold);
        }

        .score-total .score-value {
            color: var(--accent-gold);
        }

        /* ===== 诊断与建议 ===== */
        .diagnosis-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .diagnosis-card, .prescription-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .diagnosis-item {
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid;
        }

        .diagnosis-item:last-child {
            margin-bottom: 0;
        }

        .diagnosis-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .diagnosis-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .prescription-item {
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .prescription-item:last-child {
            margin-bottom: 0;
        }

        .prescription-step {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .step-num {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-gold);
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .step-content {
            flex: 1;
        }

        .step-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .step-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* ===== 分析中遮罩 ===== */
        .analyzing-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15,15,15,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
            gap: 20px;
        }

        .analyzing-overlay.show {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .analyzing-text {
            font-size: 16px;
            color: var(--text-primary);
        }

        .analyzing-progress {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }

            .nav-links {
                display: none;
            }

            .main {
                padding: 16px;
            }

            .upload-section {
                padding: 32px 20px;
            }

            .overview-grid {
                grid-template-columns: 1fr;
            }

            .scores-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .diagnosis-section {
                grid-template-columns: 1fr;
            }

            .wt-value {
                font-size: 48px;
            }

            .examples-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            }

            .example-image {
                height: 70px;
            }
        }

        @media (max-width: 480px) {
            .scores-grid {
                grid-template-columns: 1fr 1fr;
            }

            .dimensions-grid {
                grid-template-columns: 1fr;
            }

            .result-actions {
                width: 100%;
            }

            .btn {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- ===== 顶部导航 ===== -->
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo" title="返回 BEA 官网">
                <div class="logo-icon"><img src="assets/bea-logo.jpg" alt="BEA Logo"></div>
                <div class="logo-text">
                    <h1>BEA 图片分析助手</h1>
                    <p>Bipolar Emotion Aesthetics</p>
                </div>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">官网</a></li>
                    <li><a href="case-library.html">案例库</a></li>
                    <li><a href="image-analyzer.html" class="active">图片分析</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- ===== 主内容 ===== -->
    <main class="main">
        <!-- 上传区域 -->
        <div class="upload-section" id="uploadSection">
            <div class="upload-icon">📷</div>
            <h3>上传图片，一键分析美感</h3>
            <p>点击或拖拽上传产品、设计、海报、建筑、UI 等图片</p>
            <div class="upload-formats">支持 JPG / PNG / WebP · AI 自动分析 6 大维度</div>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>

        <!-- 示例图片 -->
        <div class="examples-section" id="examplesSection">
            <div class="section-title">✨ 试试这些示例</div>
            <div class="examples-grid" id="examplesGrid">
                <!-- 示例图片由 JS 动态生成 -->
            </div>
        </div>

        <!-- 分析结果 -->
        <div class="result-section" id="resultSection">
            <div class="result-header">
                <div class="result-title">📊 分析报告</div>
                <div class="result-actions">
                    <button class="btn" onclick="copyReport()">📋 复制报告</button>
                    <button class="btn" onclick="downloadReport()">💾 下载报告</button>
                    <button class="btn btn-primary" onclick="resetAll()">🔄 重新分析</button>
                </div>
            </div>

            <!-- 分析概览 -->
            <div class="overview-grid">
                <div class="image-panel">
                    <img id="analyzedImage" class="analyzed-image" alt="分析图片">
                    <div class="image-overlay" id="imageOverlay"></div>
                </div>
                <div class="wt-panel">
                    <div class="wt-label">W(T) 危极权重指数</div>
                    <div class="wt-value" id="wtValue">0.00</div>
                    <div class="wt-paradigm" id="wtParadigm">—</div>
                    <div class="wt-description" id="wtDescription">—</div>
                </div>
            </div>

            <!-- 维度分析 -->
            <div class="dimensions-section">
                <div class="section-title">🔍 六维极性分析</div>
                <div class="dimensions-grid" id="dimensionsGrid"></div>
            </div>

            <!-- 四维评分 -->
            <div class="scores-section">
                <div class="section-title">⭐ BEA 四维评分</div>
                <div class="scores-grid" id="scoresGrid"></div>
            </div>

            <!-- 诊断与建议 -->
            <div class="diagnosis-section">
                <div class="diagnosis-card">
                    <div class="card-title">🏥 病症诊断</div>
                    <div id="diagnosisList"></div>
                </div>
                <div class="prescription-card">
                    <div class="card-title">💊 改进处方</div>
                    <div id="prescriptionList"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 分析中遮罩 -->
    <div class="analyzing-overlay" id="analyzingOverlay">
        <div class="spinner"></div>
        <div class="analyzing-text">AI 正在分析图片...</div>
        <div class="analyzing-progress" id="analyzingProgress">提取图像特征</div>
    </div>

    <script>
        // ===== 全局变量 =====
        let currentImage = null;
        let analysisResult = null;
        let currentScores = {};

        // ===== 维度定义 =====
        const dimensions = [
            { key: 'shape', name: '形状线条', icon: '📐' },
            { key: 'color', name: '色彩色相', icon: '🎨' },
            { key: 'brightness', name: '明度对比', icon: '☀️' },
            { key: 'texture', name: '质感肌理', icon: '🪨' },
            { key: 'composition', name: '构图空间', icon: '📐' },
            { key: 'light', name: '光影', icon: '💡' }
        ];

        // ===== 范式定义 =====
        const paradigms = [
            { max: 0.15, name: '治愈松弛', color: '#66bb6a', desc: '极低张力，柔和放松，适合疗愈、母婴、家居' },
            { max: 0.30, name: '亲和精致', color: '#42a5f5', desc: '低张力高细节，远看柔和近看精密，商业通用' },
            { max: 0.48, name: '均衡典雅', color: '#7c8bd6', desc: '中等张力，刚柔并济，持久耐看，经典主义' },
            { max: 0.60, name: '崇高震撼', color: '#ff7043', desc: '高张力高强度，敬畏与沉醉并存，旗舰/建筑' },
            { max: 0.66, name: '冷峻克制', color: '#78909c', desc: '偏高张力，冷硬简净，专业工具/极简主义' },
            { max: 0.85, name: '先锋反叛', color: '#ba68c8', desc: '极高张力，刺激挑战，亚文化/概念设计' },
            { max: Infinity, name: '逼近越阈', color: '#ef5350', desc: '超过审美阈值，从美转为焦虑/排斥' }
        ];

        // ===== 示例图片 =====
        const examples = [
            { name: 'iPhone 17 Pro', file: 'assets/cases/iphone-17-pro.jpg' },
            { name: '小米 SU7', file: 'assets/cases/xiaomi-su7.jpg' },
            { name: '特斯拉 Cybertruck', file: 'assets/cases/tesla-cybertruck.jpg' },
            { name: '中国尊', file: 'assets/cases/citic-tower.jpg' },
            { name: '无印良品', file: 'assets/cases/muji-store.jpg' },
            { name: '大兴机场', file: 'assets/cases/daxing-airport.jpg' }
        ];

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', () => {
            initUpload();
            initExamples();
        });

        // ===== 初始化上传 =====
        function initUpload() {
            const uploadSection = document.getElementById('uploadSection');
            const fileInput = document.getElementById('fileInput');

            uploadSection.addEventListener('click', () => fileInput.click());

            uploadSection.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadSection.classList.add('dragover');
            });

            uploadSection.addEventListener('dragleave', () => {
                uploadSection.classList.remove('dragover');
            });

            uploadSection.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadSection.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    handleImage(file);
                }
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) handleImage(file);
            });
        }

        // ===== 初始化示例 =====
        function initExamples() {
            const grid = document.getElementById('examplesGrid');
            grid.innerHTML = examples.map((ex, i) => `
                <div class="example-card" onclick="loadExample(${i})">
                    <img src="${ex.file}" alt="${ex.name}" class="example-image" loading="lazy">
                    <div class="example-label">${ex.name}</div>
                </div>
            `).join('');
        }

        // ===== 加载示例 =====
        function loadExample(index) {
            const ex = examples[index];
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                currentImage = img;
                document.getElementById('analyzedImage').src = ex.file;
                analyzeImage();
            };
            img.src = ex.file;
        }

        // ===== 处理图片 =====
        function handleImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    document.getElementById('analyzedImage').src = e.target.result;
                    analyzeImage();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ===== 分析图片 =====
        function analyzeImage() {
            const overlay = document.getElementById('analyzingOverlay');
            const progress = document.getElementById('analyzingProgress');
            overlay.classList.add('show');

            const steps = ['提取图像特征', '计算边缘锐度', '分析色彩构成', '检测纹理复杂度', '评估构图对称性', '计算光影硬度', '映射 BEA 维度', '生成分析报告'];
            let step = 0;

            const progressInterval = setInterval(() => {
                if (step < steps.length) {
                    progress.textContent = steps[step];
                    step++;
                }
            }, 150);

            setTimeout(() => {
                clearInterval(progressInterval);
                const result = extractFeatures(currentImage);
                analysisResult = result;
                const scores = suggestScores(result);
                currentScores = scores;
                renderResult(result, scores);
                overlay.classList.remove('show');

                // 隐藏上传和示例，显示结果
                document.getElementById('uploadSection').style.display = 'none';
                document.getElementById('examplesSection').style.display = 'none';
                document.getElementById('resultSection').classList.add('show');

                // 滚动到结果
                document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 1500);
        }

        // ===== 提取图像特征 =====
        function extractFeatures(img) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const maxSize = 300;
            const scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const w = canvas.width;
            const h = canvas.height;

            let totalBrightness = 0, totalSaturation = 0;
            let minBrightness = 255, maxBrightness = 0;
            let warmCount = 0, coolCount = 0;
            const brightnessArray = new Float32Array(w * h);

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i+1], b = data[i+2];
                const brightness = (r + g + b) / 3;
                const idx = i / 4;
                brightnessArray[idx] = brightness;
                totalBrightness += brightness;
                minBrightness = Math.min(minBrightness, brightness);
                maxBrightness = Math.max(maxBrightness, brightness);

                const max = Math.max(r, g, b);
                const min = Math.min(r, g, b);
                const saturation = max === 0 ? 0 : (max - min) / max;
                totalSaturation += saturation;

                if (r > b + 20) warmCount++;
                else if (b > r + 20) coolCount++;
            }

            const pixelCount = data.length / 4;
            const avgBrightness = totalBrightness / pixelCount;
            const contrast = maxBrightness - minBrightness;
            const avgSaturation = (totalSaturation / pixelCount) * 100;
            const warmRatio = warmCount / pixelCount;
            const coolRatio = coolCount / pixelCount;

            // 边缘锐度（Sobel）
            let edgeStrength = 0, edgeCount = 0;
            for (let y = 1; y < h - 1; y++) {
                for (let x = 1; x < w - 1; x++) {
                    const idx = y * w + x;
                    const gx = brightnessArray[idx - w - 1] * -1 + brightnessArray[idx - w + 1] * 1 +
                               brightnessArray[idx - 1] * -2 + brightnessArray[idx + 1] * 2 +
                               brightnessArray[idx + w - 1] * -1 + brightnessArray[idx + w + 1] * 1;
                    const gy = brightnessArray[idx - w - 1] * -1 + brightnessArray[idx - w] * -2 + brightnessArray[idx - w + 1] * -1 +
                               brightnessArray[idx + w - 1] * 1 + brightnessArray[idx + w] * 2 + brightnessArray[idx + w + 1] * 1;
                    const mag = Math.sqrt(gx * gx + gy * gy);
                    edgeStrength += mag;
                    if (mag > 30) edgeCount++;
                }
            }
            const avgEdgeStrength = edgeStrength / ((w - 2) * (h - 2));
            const edgeDensity = edgeCount / ((w - 2) * (h - 2));

            // 对称性
            let symmetryDiff = 0;
            const halfW = Math.floor(w / 2);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < halfW; x++) {
                    symmetryDiff += Math.abs(brightnessArray[y * w + x] - brightnessArray[y * w + (w - 1 - x)]);
                }
            }
            const symmetryScore = 1 - (symmetryDiff / (halfW * h * 255));

            // 纹理复杂度
            let textureVariance = 0;
            for (let y = 2; y < h - 2; y += 2) {
                for (let x = 2; x < w - 2; x += 2) {
                    const idx = y * w + x;
                    const localMean = (brightnessArray[idx] + brightnessArray[idx-1] + brightnessArray[idx+1] + brightnessArray[idx-w] + brightnessArray[idx+w]) / 5;
                    textureVariance += Math.abs(brightnessArray[idx] - localMean);
                }
            }
            const avgTextureVariance = textureVariance / ((h/2) * (w/2));

            // 光影硬度
            const highlightRatio = brightnessArray.filter(b => b > 200).length / pixelCount;
            const shadowRatio = brightnessArray.filter(b => b < 50).length / pixelCount;
            const midtoneRatio = 1 - highlightRatio - shadowRatio;
            const lightHardness = (highlightRatio + shadowRatio);

            // 构图重心
            let centerX = 0, centerY = 0, totalWeight = 0;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = y * w + x;
                    const weight = Math.abs(brightnessArray[idx] - avgBrightness);
                    centerX += x * weight;
                    centerY += y * weight;
                    totalWeight += weight;
                }
            }
            const centerOffsetX = Math.abs((centerX / totalWeight) / w - 0.5) * 2;
            const centerOffsetY = Math.abs((centerY / totalWeight) / h - 0.5) * 2;
            const centerOffset = Math.sqrt(centerOffsetX * centerOffsetX + centerOffsetY * centerOffsetY);

            return {
                avgBrightness, contrast, avgSaturation, warmRatio, coolRatio,
                avgEdgeStrength, edgeDensity, symmetryScore, avgTextureVariance,
                highlightRatio, shadowRatio, midtoneRatio, lightHardness, centerOffset
            };
        }

        // ===== 建议分数 =====
        function suggestScores(result) {
            const scores = {};
            const reasons = {};

            // 形状线条
            const edgeScore = Math.min(10, Math.round((result.avgEdgeStrength / 50) * 5 + (result.edgeDensity * 10) * 5));
            scores.shape = Math.max(0, Math.min(10, edgeScore));
            reasons.shape = `边缘锐度 ${result.avgEdgeStrength.toFixed(1)}，密度 ${(result.edgeDensity * 100).toFixed(1)}%`;

            // 色彩色相
            const colorScore = Math.min(10, Math.round((result.avgSaturation / 100) * 6 + (result.coolRatio > result.warmRatio ? 3 : 0)));
            scores.color = Math.max(0, Math.min(10, colorScore));
            reasons.color = `饱和度 ${result.avgSaturation.toFixed(0)}%，暖 ${(result.warmRatio * 100).toFixed(0)}% / 冷 ${(result.coolRatio * 100).toFixed(0)}%`;

            // 明度对比
            scores.brightness = Math.max(0, Math.min(10, Math.round((result.contrast / 255) * 10)));
            reasons.brightness = `对比度 ${result.contrast.toFixed(0)}/255`;

            // 质感肌理
            scores.texture = Math.max(0, Math.min(10, Math.min(10, Math.round(result.avgTextureVariance / 200))));
            reasons.texture = `纹理方差 ${result.avgTextureVariance.toFixed(1)}`;

            // 构图空间
            const compositionScore = Math.min(10, Math.round((1 - result.symmetryScore) * 6 + result.centerOffset * 8));
            scores.composition = Math.max(0, Math.min(10, compositionScore));
            reasons.composition = `对称性 ${(result.symmetryScore * 100).toFixed(0)}%，重心偏移 ${result.centerOffset.toFixed(2)}`;

            // 光影
            scores.light = Math.max(0, Math.min(10, Math.round(result.lightHardness * 10)));
            reasons.light = `高光 ${(result.highlightRatio * 100).toFixed(0)}% / 阴影 ${(result.shadowRatio * 100).toFixed(0)}%`;

            return { scores, reasons };
        }

        // ===== 渲染结果 =====
        function renderResult(result, scoreData) {
            const scores = scoreData.scores;
            const reasons = scoreData.reasons;

            // 计算 W(T)
            const weights = { shape: 0.2, color: 0.15, brightness: 0.15, texture: 0.15, composition: 0.2, light: 0.15 };
            let wt = 0;
            for (const key in weights) {
                wt += weights[key] * (scores[key] / 10);
            }
            wt = Math.round(wt * 1000) / 1000;

            // 确定范式
            const paradigm = paradigms.find(p => wt < p.max);

            // 渲染 W(T)
            document.getElementById('wtValue').textContent = wt.toFixed(3);
            const paradigmEl = document.getElementById('wtParadigm');
            paradigmEl.textContent = paradigm.name;
            paradigmEl.style.background = paradigm.color + '33';
            paradigmEl.style.color = paradigm.color;
            document.getElementById('wtDescription').textContent = paradigm.desc;

            // 渲染分析点标注
            renderOverlay(scores);

            // 渲染维度
            renderDimensions(scores, reasons);

            // 渲染评分
            renderScores(wt, scores, paradigm);

            // 渲染诊断和建议
            renderDiagnosis(wt, paradigm, scores);
            renderPrescription(wt, paradigm, scores);

            // 保存报告数据
            window.reportData = { wt, paradigm, scores, result };
        }

        // ===== 渲染图片标注 =====
        function renderOverlay(scores) {
            const overlay = document.getElementById('imageOverlay');
            const points = [];

            if (scores.shape >= 6) points.push({ x: 20, y: 30, type: 'danger', label: '锐' });
            if (scores.color >= 6) points.push({ x: 80, y: 25, type: 'danger', label: '撞' });
            if (scores.brightness >= 6) points.push({ x: 50, y: 20, type: 'danger', label: '反' });
            if (scores.texture >= 6) points.push({ x: 30, y: 70, type: 'danger', label: '粗' });
            if (scores.composition >= 6) points.push({ x: 70, y: 60, type: 'danger', label: '偏' });
            if (scores.light >= 6) points.push({ x: 60, y: 40, type: 'danger', label: '硬' });

            if (scores.shape <= 3) points.push({ x: 25, y: 35, type: 'safe', label: '圆' });
            if (scores.color <= 3) points.push({ x: 75, y: 30, type: 'safe', label: '柔' });
            if (scores.brightness <= 3) points.push({ x: 50, y: 25, type: 'safe', label: '和' });

            overlay.innerHTML = points.map(p => `
                <div class="analysis-point ${p.type}" style="left: ${p.x}%; top: ${p.y}%;">${p.label}</div>
            `).join('');
        }

        // ===== 渲染维度 =====
        function renderDimensions(scores, reasons) {
            const grid = document.getElementById('dimensionsGrid');
            grid.innerHTML = dimensions.map(dim => {
                const score = scores[dim.key];
                const polarity = score <= 3 ? 'p' : score <= 5 ? 'n' : 't';
                const polarityText = polarity === 'p' ? '亲极' : polarity === 'n' ? '中性' : '危极';
                const color = polarity === 'p' ? '#66bb6a' : polarity === 'n' ? '#78909c' : '#ef5350';
                return `
                    <div class="dimension-card">
                        <div class="dimension-header">
                            <div class="dimension-name">${dim.icon} ${dim.name}</div>
                            <div class="dimension-score" style="color: ${color}">${score}</div>
                        </div>
                        <div class="dimension-bar">
                            <div class="dimension-fill" style="width: ${score * 10}%; background: ${color};"></div>
                        </div>
                        <span class="dimension-polarity polarity-${polarity}">${polarityText}</span>
                        <div class="dimension-reason">🔍 ${reasons[dim.key]}</div>
                    </div>
                `;
            }).join('');
        }

        // ===== 渲染评分 =====
        function renderScores(wt, scores, paradigm) {
            // 张力分
            const tension = Math.round(25 - Math.abs(wt - 0.5) * 30);
            // 秩序分（基于对称性和构图）
            const order = Math.round(15 + (analysisResult.symmetryScore * 10));
            // 阈值分
            const threshold = wt < 0.85 ? 25 : Math.round(25 - (wt - 0.85) * 50);
            // 语境分（默认中等）
            const context = 18;
            const total = Math.min(100, tension + order + threshold + context);

            const scoreData = [
                { label: '双极张力', value: tension, color: '#ff7043' },
                { label: '结构秩序', value: order, color: '#42a5f5' },
                { label: '阈值安全', value: threshold, color: '#66bb6a' },
                { label: '语境适配', value: context, color: '#ba68c8' }
            ];

            const grid = document.getElementById('scoresGrid');
            grid.innerHTML = scoreData.map(s => `
                <div class="score-card">
                    <div class="score-value" style="color: ${s.color}">${s}</div>
                    <div class="score-label">${s.label}</div>
                </div>
            `).join('') + `
                <div class="score-card score-total" style="grid-column: span 4;">
                    <div class="score-value">${total}/100</div>
                    <div class="score-label">BEA 综合评分 · ${total >= 80 ? '成熟作品' : total >= 60 ? '有潜力' : '需改进'}</div>
                </div>
            `;
        }

        // ===== 渲染诊断 =====
        function renderDiagnosis(wt, paradigm, scores) {
            const list = document.getElementById('diagnosisList');
            const diagnoses = [];

            if (wt < 0.15) diagnoses.push({ name: '甜腻症（亲极过载）', desc: '全柔无锐，发腻幼稚，缺少记忆点', color: '#66bb6a' });
            if (wt > 0.7 && wt < 0.85) diagnoses.push({ name: '攻击症（危极过载）', desc: '处处锐角强对比，令人紧张想回避', color: '#ef5350' });
            if (wt >= 0.85) diagnoses.push({ name: '越阈症', desc: '超过审美阈值，从美转为焦虑排斥', color: '#ef5350' });

            const highDims = dimensions.filter(d => scores[d.key] >= 8);
            if (highDims.length >= 3) diagnoses.push({ name: '重点通胀症', desc: '多个维度同时拉满，视觉噪音大，无重点', color: '#ff7043' });

            const lowDims = dimensions.filter(d => scores[d.key] <= 2);
            if (lowDims.length >= 3) diagnoses.push({ name: '空洞症（张力缺失）', desc: '元素都对但无记忆点，一眼到头', color: '#78909c' });

            if (analysisResult.symmetryScore < 0.4) diagnoses.push({ name: '失序症', desc: '对称性低，缺少秩序主线，元素互相打架', color: '#ff7043' });

            if (diagnoses.length === 0) {
                diagnoses.push({ name: '状态良好', desc: '双极配比均衡，结构秩序清晰，处于审美黄金区', color: '#66bb6a' });
            }

            list.innerHTML = diagnoses.map(d => `
                <div class="diagnosis-item" style="border-left-color: ${d.color};">
                    <div class="diagnosis-name" style="color: ${d.color};">${d.name}</div>
                    <div class="diagnosis-desc">${d.desc}</div>
                </div>
            `).join('');
        }

        // ===== 渲染建议 =====
        function renderPrescription(wt, paradigm, scores) {
            const list = document.getElementById('prescriptionList');
            const prescriptions = [];

            if (wt < 0.2) {
                prescriptions.push({ title: '增加危极提神点', desc: '在高价值细节（边缘、按键、logo）注入 10-20% 锐利元素，柔中藏骨' });
            }
            if (wt > 0.6) {
                prescriptions.push({ title: '扩大亲极基底', desc: '增加柔和曲面、柔光、对称秩序，用强大的安抚力压住张力' });
            }

            const maxDim = dimensions.reduce((a, b) => scores[a.key] > scores[b.key] ? a : b);
            if (scores[maxDim.key] >= 7) {
                prescriptions.push({ title: `降低${maxDim.name}强度`, desc: `${maxDim.name}维度危极过高，建议从 ${scores[maxDim.key]}/10 降到 5-6/10` });
            }

            const minDim = dimensions.reduce((a, b) => scores[a.key] < scores[b.key] ? a : b);
            if (scores[minDim.key] <= 2) {
                prescriptions.push({ title: `补充${minDim.name}对立极`, desc: `${minDim.name}维度过于亲极，建议适度增加张力，从 ${scores[minDim.key]}/10 提到 3-4/10` });
            }

            if (analysisResult.symmetryScore < 0.5) {
                prescriptions.push({ title: '建立秩序主线', desc: '增加对称/比例/节奏等秩序元素，把对立收进统一框架' });
            }

            prescriptions.push({ title: '远近距双重验证', desc: '退到真实使用距离看第一情绪，凑近看细节锚点，连续使用数日看是否疲劳' });

            list.innerHTML = prescriptions.slice(0, 5).map((p, i) => `
                <div class="prescription-item">
                    <div class="prescription-step">
                        <div class="step-num">${i + 1}</div>
                        <div class="step-content">
                            <div class="step-title">${p.title}</div>
                            <div class="step-desc">${p.desc}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ===== 复制报告 =====
        function copyReport() {
            const data = window.reportData;
            const report = `【BEA 双极情绪美学分析报告】

W(T) 危极权重：${data.wt.toFixed(3)}
美学范式：${data.paradigm.name}
范式说明：${data.paradigm.desc}

六维极性分析：
${dimensions.map(d => `  ${d.name}：${data.scores[d.key]}/10`).join('\n')}

改进建议：
1. 参考图片标注的危极/亲极点，针对性调整
2. 保持主辅极性比例至少 6:4

4. 远近距双重验证，确保长期耐看

由 BEA 图片分析助手生成
https://maxing0000.github.io/bipolar-emotion-aesthetics/image-analyzer.html`;

            navigator.clipboard.writeText(report).then(() => {
                alert('报告已复制到剪贴板！');
            }).catch(() => {
                alert('复制失败，请手动选择文本复制');
            });
        }

        // ===== 下载报告 =====
        function downloadReport() {
            const data = window.reportData;
            const report = `BEA 双极情绪美学分析报告
${'='.repeat(50)}

W(T) 危极权重：${data.wt.toFixed(3)}
美学范式：${data.paradigm.name}
范式说明：${data.paradigm.desc}

六维极性分析：
${dimensions.map(d => `  ${d.name}：${data.scores[d.key]}/10`).join('\n')}

图像特征：
  平均亮度：${data.result.avgBrightness.toFixed(0)}/255
  对比度：${data.result.contrast.toFixed(0)}/255

  对称性：${(data.result.symmetryScore * 100).toFixed(1)}%

改进建议：

4. 远近距双重验证，确保长期耐看
5. 目标受众审美窗口内把张力推到尽可能靠右

${'='.repeat(50)}
由 BEA 图片分析助手生成
https://maxing0000.github.io/bipolar-emotion-aesthetics/image-analyzer.html`;

            const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `BEA分析报告_${data.wt.toFixed(3)}_${data.paradigm.name}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ===== 重置 =====
        function resetAll() {
            currentImage = null;
            analysisResult = null;
            currentScores = {};

            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('examplesSection').style.display = 'block';
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('fileInput').value = '';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
