<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEA 图片分析 · 双极情绪美学</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #0d0d0d;
            color: #f5e6d3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            max-width: 700px;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, #d4a574, #8b5a2b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 900;
            color: #1a1a1a;
            box-shadow: 0 10px 40px rgba(212,165,116,0.3);
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #f5e6d3;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #a8a29e;
            line-height: 1.8;
            margin-bottom: 2.5rem;
        }
        .highlight {
            color: #d4a574;
            font-weight: 600;
        }
        .steps {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2.5rem;
        }
        .step {
            padding: 1.5rem 1rem;
            background: rgba(212,165,116,0.08);
            border: 1px solid rgba(212,165,116,0.2);
            border-radius: 12px;
        }
        .step-num {
            font-size: 1.5rem;
            font-weight: 900;
            color: #d4a574;
            margin-bottom: 0.5rem;
        }
        .step-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f5e6d3;
            margin-bottom: 0.3rem;
        }
        .step-desc {
            font-size: 0.8rem;
            color: #6b6560;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, #d4a574, #c4956a);
            color: #1a1a1a;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 20px rgba(212,165,116,0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212,165,116,0.4);
        }
        .btn-secondary {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: transparent;
            color: #d4a574;
            border: 1px solid rgba(212,165,116,0.4);
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            margin-top: 1rem;
            transition: background 0.3s;
        }
        .btn-secondary:hover {
            background: rgba(212,165,116,0.1);
        }
        .platforms {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        .platform {
            font-size: 0.85rem;
            color: #6b6560;
        }
        .platform span {
            color: #a8a29e;
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .subtitle { font-size: 1rem; }
            .steps { grid-template-columns: 1fr; }
            .btn { padding: 0.9rem 2rem; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">BEA</div>
        <h1>图片分析请使用 BEA 技能</h1>
        <p class="subtitle">
            网页版无法真正理解图片内容，只能做基础像素检测。<br>
            <span class="highlight">推荐在 AI 平台使用 BEA 技能</span>，让真正的多模态 AI<br>
            理解你的设计，给出更专业、更准确的分析报告。
        </p>

        <div class="steps">
            <div class="step">
                <div class="step-num">01</div>
                <div class="step-title">安装技能</div>
                <div class="step-desc">在豆包/扣子/ChatGPT 等平台安装或配置 BEA 技能</div>
            </div>
            <div class="step">
                <div class="step-num">02</div>
                <div class="step-title">上传图片</div>
                <div class="step-desc">上传产品/设计/建筑/UI 图片，或用大白话描述</div>
            </div>
            <div class="step">
                <div class="step-num">03</div>
                <div class="step-title">获得报告</div>
                <div class="step-desc">AI 自动输出 W(T)、范式、六维分析、病症诊断和改进处方</div>
            </div>
        </div>

        <a href="https://github.com/Maxing0000/bipolar-emotion-aesthetics" target="_blank" class="btn">
            📦 获取 BEA 技能（GitHub）
        </a>
        <br>
        <a href="index.html" class="btn-secondary">← 返回官网</a>

        <div class="platforms">
            <div class="platform">🤖 <span>豆包</span></div>
            <div class="platform">🔌 <span>扣子</span></div>
            <div class="platform">💬 <span>ChatGPT</span></div>
            <div class="platform">🎨 <span>Claude</span></div>
            <div class="platform">✨ <span>通义千问</span></div>
        </div>
    </div>
</body>
</html>
