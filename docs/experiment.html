<div class="card" id="app"></div>

<script>
/* ================= 组织者配置区（实验前编辑这里） ================= */
const CONFIG = {
  category: "品牌海报",           // 品类名称（记入数据）
  // 三个版本：id 对外隐藏，img 为图片路径（与本文件同目录或相对路径），wt 为核算的 W(T)
  versions: [
    { id: "V-low",  img: "v-low.jpg",  wt: 0.10 },
    { id: "V-mid",  img: "v-mid.jpg",  wt: 0.24 },
    { id: "V-high", img: "v-high.jpg", wt: 0.45 }
  ]
};
/* ================================================================= */

const LABELS = ["版本A", "版本B", "版本C"];
let state = null;

function shuffle(a) {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

function loadAll() {
  try { return JSON.parse(localStorage.getItem("bea_exp") || '{"responses":[]}'); }
  catch (e) { return { responses: [] }; }
}
function saveAll(d) { localStorage.setItem("bea_exp", JSON.stringify(d)); }

function newSession() {
  state = {
    step: "bg",
    order: shuffle(CONFIG.versions.map((v, i) => i)),   // 随机展示顺序
    idx: 0,
    bg: { age: "", design: "", city: "" },
    ratings: {}
  };
  render();
}

function render() {
  const app = document.getElementById("app");
  if (state.step === "bg") {
    app.innerHTML = `
      <h1>设计偏好小调查</h1>
      <div class="sub">匿名盲评 · 约 3 分钟 · 感谢参与</div>
      <label>年龄段</label>
      <select id="age"><option value="">请选择</option>
        <option>18-25</option><option>26-35</option><option>36-45</option><option>46+</option></select>
      <label>是否设计相关专业 / 从业</label>
      <select id="design"><option value="">请选择</option>
        <option value="no">否</option><option value="yes">是</option></select>
      <label>城市线级</label>
      <select id="city"><option value="">请选择</option>
        <option>一线</option><option>新一线</option><option>二线</option><option>三线及以下</option></select>
      <div class="nav"><button onclick="startRating()">开始 →</button></div>
      <div class="note">接下来你会看到 ${CONFIG.versions.length} 个设计版本（随机顺序），
      请凭直觉打分，没有对错之分。</div>`;
  } else if (state.step === "rate") {
    const vi = state.order[state.idx];
    const v = CONFIG.versions[vi];
    const label = LABELS[state.idx];
    const r = state.ratings[v.id] || {};
    app.innerHTML = `
      <div class="progress">${state.idx + 1} / ${CONFIG.versions.length}</div>
      <h1>${label}</h1>
      <div class="sub">凭第一感觉打分即可</div>
      <div class="stim"><img src="${v.img}" alt="${label}"
        onerror="this.outerHTML='<div class=ph>图片未找到：${v.img}<br>请组织者检查 CONFIG 路径</div>'"></div>
      <div class="q"><div class="qt">1. 你有多喜欢这个设计？</div>
        <div class="scale" id="like">${[1,2,3,4,5,6,7].map(n =>
          `<button class="${r.like===n?'sel':''}" onclick="pick('like',${n})">${n}</button>`).join("")}</div>
        <div class="scale-labels"><span>很不喜欢</span><span>非常喜欢</span></div></div>
      <div class="q"><div class="qt">2. 你有多大意愿为它付费 / 转发？</div>
        <div class="scale" id="pay">${[1,2,3,4,5,6,7].map(n =>
          `<button class="${r.pay===n?'sel':''}" onclick="pick('pay',${n})">${n}</button>`).join("")}</div>
        <div class="scale-labels"><span>完全不愿意</span><span>非常愿意</span></div></div>
      <div class="nav"><button id="nextBtn" disabled onclick="next()">
        ${state.idx < CONFIG.versions.length - 1 ? "下一个 →" : "完成 ✓"}</button></div>`;
  } else if (state.step === "done") {
    const all = loadAll();
    app.innerHTML = `
      <h1>感谢参与！🎉</h1>
      <div class="sub">你的评分已保存（本机已累计 ${all.responses.length} 份）</div>
      <div class="nav">
        <button class="ghost" onclick="newSession()">下一位被试 →</button>
        <button onclick="showExport()">组织者：导出数据</button>
      </div>`;
  } else if (state.step === "export") {
    const all = loadAll();
    const payload = JSON.stringify({
      category: CONFIG.category,
      versions: CONFIG.versions.map(v => ({ id: v.id, wt: v.wt })),
      responses: all.responses
    }, null, 2);
    app.innerHTML = `
      <h1>导出实验数据</h1>
      <div class="sub">共 ${all.responses.length} 份 · 保存为 .json 后用 analyze_experiment.py 分析</div>
      <div class="nav">
        <button class="ghost" onclick="copyData()">复制 JSON</button>
        <button onclick="downloadData()">下载 JSON</button>
      </div>
      <textarea readonly id="out">${payload.replace(/</g, "&lt;")}</textarea>
      <div class="nav">
        <button class="ghost" onclick="newSession()">继续收集</button>
        <button class="ghost" onclick="if(confirm('清空本机全部已收集数据？')){localStorage.removeItem('bea_exp');newSession();}">清空数据</button>
      </div>`;
  }
}

function startRating() {
  const age = document.getElementById("age").value;
  const design = document.getElementById("design").value;
  const city = document.getElementById("city").value;
  if (!age || !design || !city) { alert("请完成三个背景问题"); return; }
  state.bg = { age, design, city };
  state.step = "rate";
  render();
}

function pick(q, n) {
  const vi = state.order[state.idx];
  const v = CONFIG.versions[vi];
  state.ratings[v.id] = state.ratings[v.id] || {};
  state.ratings[v.id][q] = n;
  render();
  const r = state.ratings[v.id];
  if (r.like && r.pay) document.getElementById("nextBtn").disabled = false;
}

function next() {
  if (state.idx < CONFIG.versions.length - 1) {
    state.idx++;
    render();
  } else {
    const all = loadAll();
    all.responses.push({ background: state.bg, ratings: state.ratings });
    saveAll(all);
    state.step = "done";
    render();
  }
}

function showExport() { state.step = "export"; render(); }
function copyData() {
  const t = document.getElementById("out");
  t.select(); document.execCommand("copy");
  alert("已复制，粘贴保存为 .json 文件即可");
}
function downloadData() {
  const blob = new Blob([document.getElementById("out").value], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bea-experiment-data.json";
  a.click();
}

newSession();
</script>
