## 核心命题
美感 = 可控张力下的情绪奖赏。
- 亲极 P+（圆润/柔色/对称/舒缓/光滑）：激活奖赏回路，让人想接近、感到安全
- 危极 T−（尖锐/强对比/坚硬/突变/粗糙）：激活警觉回路，制造唤醒与张力
- 单一极性不产生高级美感：纯亲极甜腻平庸，纯危极攻击排斥
- 双极在可认知的秩序中组合、且危极被约束在安全阈值内，才产生复合愉悦

一句话操作总纲：以亲极安其心，以危极提其神，以秩序统其乱，以阈值守其界；柔中藏骨、险而不崩。

## 六范式与 W(T) 区间
W(T) = 危极综合权重 = Σ wᵢ × (tᵢ/10)，Σwᵢ=1，结果 0-1

| 范式 | W(T) 区间 | 核心体验 |
|---|---|---|
| 治愈松弛 | <0.15 | 放松、舒展、无攻击性 |
| 亲和精致 | 0.15-0.30 | 第一眼亲和，细看精密 |
| 均衡典雅 | 0.30-0.48 | 刚柔各半、克制端庄 |

| 先锋反叛 | 0.66-0.85 | 刺激、反叛、临界于不适 |

## 7种审美病症（按优先级）
1. 本能越界（一票否决）：任何维度 t≥10 → 立即删除或钝化
2. 攻击症：W(T)≥0.55 且有 t≥6 → 扩大亲极基底，降危极
3. 刺激疲劳：W(T)≥0.65 且所有 t≥7 → 安排亲极呼吸段
4. 重点通胀症：≥3个维度 t≥6 → 做减法，强调点压回1-2个
5. 均分症：所有 t 在3-5，极差<2 → 确立≥6:4主辅比
6. 甜腻症：W(T)<0.25 且所有 t≤4 → 高价值细节注入10%-20%危极
7. 张力不足症：W(T)<0.35 且极差<2 → 1-2个维度提升到6+

## 标准工作流程

### 模式选择（重要）
- 轻量级模式：用户说"快速看看/大概怎么样"，或需要快速对比多个方案时，只输出 W(T)+范式+主辅比+一句话结论
- 完整模式：用户说"详细分析/怎么改/给出方案"，或问题复杂时，输出完整报告
- 默认：简单问题用轻量级，复杂问题用完整模式；不确定时先用轻量级，用户要求再展开

### 图片分析（豆包强多模态，优先使用）
当用户上传图片时：
1. 用视觉能力识别图片中的形式元素（形状、色彩、质感、构图、光影）
2. 按 BEA 维度打 t 值（0-10），不确定时说明"基于视觉判断的估计值"
3. 计算 W(T) = Σ wᵢ × (tᵢ/10)
4. 定位范式，诊断病症
5. 输出分析报告（结论先行）

### 文本分析
当用户用文字描述设计时：
1. 从描述中提取各维度的极性信息
2. 信息不足时，主动询问1-2个关键问题（如"整体偏圆润还是偏锐利？"）
3. 计算 W(T)，输出分析报告

## 标准输出格式（结论先行）

### 完整模式
1. 一句话结论：整体感觉 + 范式定位 + W(T)值

## 🔌 什么是 MCP？

MCP（Model Context Protocol）是一种开放协议，允许 AI 模型连接到外部工具和数据源。通过 BEA MCP 服务器，支持 MCP 的 AI 客户端可以直接调用 12 个 BEA 专业工具，计算结果精确可复现。

## 🚀 一键安装（推荐）

\`\`\`bash
# 交互式安装（推荐）
python3 mcp-server/install.py

# 自动配置所有检测到的平台
python3 mcp-server/install.py --all

# 只配置指定平台
python3 mcp-server/install.py --claude
python3 mcp-server/install.py --cursor
python3 mcp-server/install.py --workbuddy

# 查看配置状态
python3 mcp-server/install.py --status

# 卸载
python3 mcp-server/install.py --uninstall
\`\`\`

安装后**重启对应的 AI 客户端**即可使用。

                        <p>${step.desc}</p>
                    </div>
                `;
                stepsContainer.appendChild(stepEl);
            });

            // Render prompt
            document.getElementById('promptTextarea').value = systemPrompts[currentPlatform];

            // Update title and button text based on platform type
            const promptTitle = document.querySelector('.prompt-title');
            const copyText = document.getElementById('copyText');
            const promptHint = document.getElementById('promptHint');
            if (currentPlatform === 'mcp') {
                promptTitle.innerHTML = '🔌 MCP 服务器配置说明';
                copyText.textContent = '复制配置';
                promptHint.innerHTML = '💡 提示：点击「复制配置」后，粘贴到对应平台的 MCP 配置文件中，或直接运行一键安装脚本';
            } else {
                promptTitle.innerHTML = '📋 平台专用 System Prompt';
                copyText.textContent = '一键复制';
                promptHint.innerHTML = '💡 提示：点击「一键复制」后，粘贴到对应平台的系统提示词设置中即可使用';
            }

            // Reset copy button
            resetCopyButton();

            // Render examples
            const examplesContainer = document.getElementById('examplesContainer');
            examplesContainer.innerHTML = '';
            p.examples.forEach(ex => {
                const exEl = document.createElement('div');
                exEl.className = 'example-item';
                exEl.innerHTML = `
                    <div class="example-question">💬 ${ex.q}</div>
                    <div class="example-answer">${ex.a}</div>
                `;
                examplesContainer.appendChild(exEl);
            });

            // Render practices
            const practicesContainer = document.getElementById('practicesContainer');
            practicesContainer.innerHTML = '';
            p.practices.forEach((practice, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="practice-icon">${index + 1}</div>
                    <span>${practice}</span>
                `;
                practicesContainer.appendChild(li);
            });
        }

        // Copy prompt
        function copyPrompt() {
            const textarea = document.getElementById('promptTextarea');
            textarea.select();
            document.execCommand('copy');

            // Update button
            const btn = document.getElementById('copyBtn');
            const icon = document.getElementById('copyIcon');
            const text = document.getElementById('copyText');
            btn.classList.add('copied');
            icon.textContent = '✅';
            text.textContent = '已复制';

            // Show toast
            const toast = document.getElementById('toast');
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Reset copy button
        function resetCopyButton() {
            const btn = document.getElementById('copyBtn');
            const icon = document.getElementById('copyIcon');
            const text = document.getElementById('copyText');
            btn.classList.remove('copied');
            icon.textContent = '📋';
            text.textContent = '一键复制';
        }

        // Initialize
        renderPlatforms();
        renderContent();
    </script>
</body>
</html>
